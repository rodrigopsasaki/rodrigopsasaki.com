<svg xmlns="http://www.w3.org/2000/svg" width="740" height="520" viewBox="0 0 740 520" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, ui-monospace, monospace"><title id="title">The same taste balance at a different intensity</title>
<desc id="desc">Three black coffees drawn as taste shapes on one set of three spokes for sweetness, nuttiness, and citrus brightness. Gentle: 0.1, 0.3 and 0.3. Pronounced: 0.2, 0.6 and 0.6. Citrus-led: 0.1, 0.2 and 0.6. The pronounced outline is the gentle outline at twice the size; the citrus-led outline reaches farther along the citrus spoke.</desc>
