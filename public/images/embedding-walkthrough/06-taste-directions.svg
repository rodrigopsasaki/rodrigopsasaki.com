<svg xmlns="http://www.w3.org/2000/svg" width="740" height="590" viewBox="0 0 740 590" role="img" aria-labelledby="title desc" font-family="JetBrains Mono, ui-monospace, monospace"><title id="title">Compare the balance of three flavor notes by direction</title>
<desc id="desc">A view of three-part taste addresses with arrows from one start. The gentle and pronounced coffee profiles point in exactly the same direction, with the pronounced profile's arrow twice as long. The citrus-led profile points in a different direction. Small equal-sized coffee cups identify the destinations. Measured by straight-line nearness, the citrus-led cup is closer to the gentle one.</desc>
